name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Version bump (0.7.1 → minor → 0.8.0)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release source
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/master ]; then
            echo 'Manual releases must run from master.' >&2
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'master advanced since dispatch; start a new release run.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/master
      - run: npm ci
      - name: Prepare version commit and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          STRATEGY: ${{ inputs.strategy }}
          REF_NAME: ${{ github.ref_name }}
          HUSKY: '0'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$STRATEGY" in patch|minor|major) ;; *) exit 1 ;; esac
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            npm version "$STRATEGY" -m 'chore(release): v%s'
            TAG="v$(node -p 'require("./package.json").version')"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run test:release
      - run: npm run test:ci
      - run: npm run package
      - run: npm run build
      - name: Verify versions and extract release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm run release:check -- "$RELEASE_TAG"
          npm run release:notes
      - name: Pack once
        run: |
          npm pack ./dist/ngx-dom-confetti --pack-destination dist --json > dist/pack.json
          node --input-type=module -e 'import fs from "node:fs"; const [pack] = JSON.parse(fs.readFileSync("dist/pack.json")); fs.renameSync(`dist/${pack.filename}`, "dist/ngx-dom-confetti.tgz");'
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            dist/ngx-dom-confetti.tgz
            dist/release-notes.md
          if-no-files-found: error
      - name: Push validated version commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/master "refs/tags/$RELEASE_TAG"

  publish-npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release
      - uses: actions/setup-node@v4
        with:
          # Includes npm >= 11.5.1, required for trusted publishing.
          node-version: '>=24.15.0 <25'
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish ./release/ngx-dom-confetti.tgz --access public --registry=https://registry.npmjs.org/

  release:
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release/release-notes.md
          files: release/ngx-dom-confetti.tgz
          draft: false
          prerelease: false
